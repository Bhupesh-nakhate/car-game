<script>
(()=>{'use strict';

c.fillStyle='rgba(0,0,0,.33)';rr(c,-w/2+w*.1,-h/2+h*.05,w,h,w*.3);c.fill();

c.fillStyle='rgba(0,0,0,.25)';c.fillRect(-w*.2,-h*.2,w*.4,h*.1);c.fillRect(-w*.2,h*.1,w*.4,h*.1)}
else{g.addColorStop(0,sh(col,-45));g.addColorStop(.28,col);g.addColorStop(.5,sh(col,28));g.addColorStop(.72,col);g.addColorStop(1,sh(col,-45));c.fillStyle=g;rr(c,-w/2,-h/2,w,h,w*(t==='hyper'||t==='super'?.38:.3));c.fill();
